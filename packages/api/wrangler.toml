name = "aidenjang-auth"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain (accounts.aidenjang.com), not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the web Vite proxy target (packages/web/vite.config.ts).
[dev]
port = 34100

# Identity store: users + sessions. database_id is filled in at deploy (step 1.9);
# local dev uses miniflare's local D1.
[[d1_databases]]
binding = "DB"
database_name = "aidenjang-identity"
database_id = "26bcf1d8-ac6a-421f-bd8d-442115284ede"
migrations_dir = "migrations"

# Fixed-window rate limiter, one Durable Object instance per action:ip.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Serve the built login/account UI (packages/web) from this same Worker, so the UI and
# API share the accounts.aidenjang.com origin (no CORS between them, one deploy).
# run_worker_first = true → the Worker routes everything; /auth/* + /health are the API,
# the catch-all serves assets (real files + SPA fallback to index.html).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Requires the aidenjang.com zone on this Cloudflare account; provisioned on
# `wrangler deploy`. Ignored by local `wrangler dev`.
[[routes]]
pattern = "accounts.aidenjang.com"
custom_domain = true

# Workers Logs — native, free-tier error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1
