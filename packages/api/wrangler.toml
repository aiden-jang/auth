name = "aidenjang-auth"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain (accounts.aidenjang.com), not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the web Vite proxy target (packages/web/vite.config.ts).
[dev]
port = 34100
host = "localhost"
upstream_protocol = "http"

# Identity storage; local development uses Miniflare’s local D1.
[[d1_databases]]
binding = "DB"
database_name = "aidenjang-identity"
database_id = "26bcf1d8-ac6a-421f-bd8d-442115284ede"
migrations_dir = "migrations"

# Fixed-window rate limiter, one Durable Object instance per action:ip.
# Product events, written fire-and-forget from the routes. One dataset across every app, with the
# app name in index1 and blob1, so a single query can compare them.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Serve the login UI and API on one origin; the Worker handles auth routes before falling back to assets.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Requires the aidenjang.com zone on this Cloudflare account; provisioned on
# `wrangler deploy`. Ignored by local `wrangler dev`.
[[routes]]
pattern = "accounts.aidenjang.com"
custom_domain = true

# Worker logs are available through `wrangler tail` and the Cloudflare dashboard.
[observability]
enabled = true
head_sampling_rate = 1
