# Only wired apps are workspace members. Imported-but-not-yet-ported apps live under apps/
# as parked source and are added here when their port phase restructures them.
packages:
  - 'apps/auth/*'
  - 'apps/owewell/*'
  - 'apps/bloomnote/*'
  - 'apps/is-it-a-dog/shared'
  - 'apps/is-it-a-dog/packages/*'
  - 'apps/wherever/packages/*'
  - 'packages/*'
