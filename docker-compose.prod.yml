# Production stack for a single always-on VM (e.g. Oracle Cloud Always Free).
# Self-contained and $0 to run: Postgres + the built API + Caddy for automatic HTTPS.
# Bring up with:  docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env file next to this one with POSTGRES_PASSWORD set (see deploy/oracle-vm.md).
name: platform-prod

services:
  db:
    image: postgres:16-alpine
    container_name: platform-prod-db
    restart: always
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runner
    container_name: platform-prod-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://platform:${POSTGRES_PASSWORD}@db:5432/platform?schema=public'
      PORT: '30000'
      API_PREFIX: '/owewell'
      # The frontends allowed to call this API with credentials (comma-separated).
      CORS_ORIGINS: '${CORS_ORIGINS:-https://owewell.aidenjang.com}'
      # Shared parent domain so the session cookie works across *.aidenjang.com.
      COOKIE_DOMAIN: '${COOKIE_DOMAIN:-.aidenjang.com}'
      APP_URL: '${APP_URL:-https://owewell.aidenjang.com}'
      # Real receipt OCR stays off (mock) unless you set this. Leave unset for $0.
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
    # Not published to the host: only Caddy talks to it, over the internal network.
    expose:
      - '30000'

  caddy:
    image: caddy:2-alpine
    container_name: platform-prod-caddy
    restart: always
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
