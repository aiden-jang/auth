name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # owewell's server still uses Prisma until its Cloudflare port; its types are generated.
      - run: pnpm --filter @owewell/server exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # test job is added in Phase 2.9 once owewell's suite runs on Workers (no external DB).
