name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every gate below must actually run. A script named `docs` was shadowed by npm's own docs
      # command, reporting green while never executing — hence `check:docs` and `pnpm run`.
      - run: pnpm run gates
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Fails on an export nothing imports, so a refactor that orphans code says so here rather
      # than leaving it to be found by someone wondering whether it is still load-bearing.
      - run: pnpm run knip
      # Comment budget, duplicates, and comments a move left behind describing something that is no
      # longer under them. The last one caught a route claiming a defence it did not have.
      - run: pnpm run comments
      # Ceilings on file length and component state. index.ts once reached 1225 lines and
      # AccountPage 1151, both passing every other gate the whole way up.
      - run: pnpm run size
      # Every route documented, every path in the docs real. API.md had fallen twenty routes behind.
      - run: pnpm run check:docs
      # The deploy applies migrations before it publishes, so a migration that cannot apply is a
      # deploy that does not happen. Catches both a schema change with no migration and a migration
      # committed without its snapshot.
      - run: pnpm run migrations
      # Generated drizzle snapshots and the lockfile are in .prettierignore; everything a person
      # writes is checked.
      - run: pnpm run format:check
      - run: pnpm run build
      # Every suite runs in-process: the SPA and the client under Node, the API against a real
      # in-memory D1 via the Workers pool. No external database needed.
      - run: pnpm -r test
      # The browser journey: register, follow the emailed link, sign out, sign back in. It starts
      # its own worker and vite, so nothing here needs a deployed environment.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/web
      - run: pnpm --filter @aidenjang/auth-web e2e

  # Auto-deploy to Cloudflare on merge to main, only after the checks above pass.
  # Requires a CLOUDFLARE_API_TOKEN repo secret with BOTH Workers Scripts:Edit and D1:Edit.
  # D1 is not optional: `pnpm run deploy` applies pending migrations before it ships the code, and a
  # Workers-only token fails that step with a 7403 and never reaches the deploy.
  # Wrangler infers the account from the token, so no account_id is needed here.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, then the code, in that order and failing hard if the migration fails.
      # Shipping code whose migration has not run is what 500'd /auth/me for every app once: the
      # column was missing in production and every session lookup threw. `pnpm run deploy` chains
      # `d1 migrations apply aidenjang-identity --remote` ahead of `wrangler deploy` so the two cannot
      # drift apart. Applying by hand was the old contract and is what allowed that drift.
      - name: Deploy to Cloudflare
        run: pnpm run deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Bake the "Continue with Google" button into the prod web build. Locally this comes from
          # web/.env.local (gitignored), which CI doesn't have. The server OAuth secrets
          # (GOOGLE_CLIENT_ID/SECRET) are set once on the Worker via `wrangler secret put`.
          VITE_GOOGLE_ENABLED: 'true'
          # Turnstile SITE key — PUBLIC (it ships in the client bundle). Must be baked into the prod
          # build or the widget never renders and, because the Worker has TURNSTILE_SECRET set, every
          # auth call 400s with TURNSTILE_FAILED (blocking login/signup/password-reset — and their
          # emails). The paired secret stays a `wrangler secret` on the Worker.
          VITE_TURNSTILE_SITE_KEY: '0x4AAAAAADxBNTw4CP1ZhzK1'
