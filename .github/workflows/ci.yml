name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GOOGLE_ENABLED: 'true'
      VITE_TURNSTILE_SITE_KEY: '0x4AAAAAADxBNTw4CP1ZhzK1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:core
      - uses: actions/upload-artifact@v6
        with:
          name: production-assets
          path: packages/web/dist
          if-no-files-found: error
          retention-days: 7

  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aidenjang/auth-web exec playwright install --with-deps chromium
      - run: pnpm --filter @aidenjang/auth-web e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-results
          path: packages/web/test-results
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: [check, browser-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: production-assets
          path: packages/web/dist
      # D1 migrations must succeed before code ships; reuse the verified web bundle.
      - name: Deploy to Cloudflare
        run: pnpm --filter @aidenjang/auth-api run deploy:assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
