<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand identity:
       - Cream paper (#FAF5EC)
       - Pink 6-petal flower with yellow center
       - Fraunces serif wordmark in deep green
       - DM Sans tagline in soft green

       The flower shape mirrors the favicon (public/favicon.svg) — same
       6-circle arrangement, same color values — scaled up so the
       favicon and OG image read as the same identity. The product's
       in-app gardens use whatever colors the AI invents; the brand
       surfaces (favicon, OG, marketing) stay anchored to pink. -->
  <rect width="1200" height="630" fill="#FAF5EC"/>

  <!-- Flower on the right -->
  <g transform="translate(960, 315)">
    <!-- Six petals — same arrangement as the favicon's 32×32 grid,
         scaled and spaced for poster size. Hand-tuned center offsets
         to keep the petal cluster compact without overlap. -->
    <circle cx="0"   cy="-110" r="82" fill="#FF8FA3"/>
    <circle cx="95"  cy="-55"  r="82" fill="#FF8FA3"/>
    <circle cx="95"  cy="55"   r="82" fill="#FF8FA3"/>
    <circle cx="0"   cy="110"  r="82" fill="#FF8FA3"/>
    <circle cx="-95" cy="55"   r="82" fill="#FF8FA3"/>
    <circle cx="-95" cy="-55"  r="82" fill="#FF8FA3"/>
    <!-- Yellow center, plus inner shadow tint for depth -->
    <circle cx="0" cy="0" r="72" fill="#FFD700"/>
    <circle cx="0" cy="0" r="34" fill="#FFA500" opacity="0.4"/>
    <!-- Subtle pollen specks for texture -->
    <circle cx="-20" cy="-25" r="3" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="22"  cy="-12" r="3" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="0"   cy="20"  r="3" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Wordmark — large, serif, deep green. Uses Fraunces if the
       rendering surface has it; falls back to Playfair then Georgia. -->
  <text
    x="100"
    y="295"
    font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="180"
    font-weight="500"
    fill="#2D5A1B"
    letter-spacing="-4">
    bloomnote
  </text>

  <!-- Tagline below the wordmark, matching the in-app subtitle copy. -->
  <text
    x="105"
    y="365"
    font-family="DM Sans, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="36"
    font-weight="400"
    fill="#7a8f6b"
    letter-spacing="-0.5">
    write a note. we grow them a garden.
  </text>
</svg>
