<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bloomnote</title>

    <!-- Favicon. SVG so it scales perfectly across all sizes (browser
         tabs, bookmarks, the OS-level page-pinning some browsers do).
         theme-color tints the mobile browser chrome to the cream
         background so the page feels seamless from the address bar
         down. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Raster fallbacks for surfaces that don't accept SVG icons:
         the iOS share sheet, "Add to Home Screen", PWA install prompts
         on Android, and older browsers. Without apple-touch-icon, iOS
         falls back to a generic Safari snapshot on those surfaces.
         All three PNGs are generated from favicon.svg by
         `npm run gen-icons` — re-run after editing the SVG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF5EC" />

    <!-- Homepage default share metadata. (Per-garden previews for /g/<id>
         shares are a possible future enhancement in the Worker.) -->
    <meta
      name="description"
      content="Write someone a note. We grow them a garden you can send."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloomnote.aidenjang.com/" />
    <meta property="og:title" content="bloomnote" />
    <meta
      property="og:description"
      content="Write someone a note. We grow them a garden you can send."
    />
    <meta property="og:image" content="https://bloomnote.aidenjang.com/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="a pink illustrated flower next to the wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="bloomnote" />
    <meta
      name="twitter:description"
      content="Write someone a note. We grow them a garden you can send."
    />
    <meta name="twitter:image" content="https://bloomnote.aidenjang.com/og.svg" />

    <!-- Resource hints for the Google Fonts request.
         - `preconnect` opens an early TLS connection to both origins
           (the CSS host and the font-file host).
         - `preload as="style"` starts the CSS fetch in the high-
           priority queue immediately, so font-face declarations
           arrive in parallel with — instead of after — the rest of
           the document parsing. The matching `<link rel="stylesheet">`
           is deduped against this preload.
         - `display=swap` in the URL means text renders in fallback
           font immediately and swaps to Fraunces when the woff2
           arrives — eliminates the invisible-text window. There's
           still a brief visible swap (FOUT) on first uncached load;
           Playfair Display is in the font stack as a closer-shape
           fallback than Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
