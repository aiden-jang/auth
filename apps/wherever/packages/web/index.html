<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wherever, Honestly</title>
    <meta name="description" content="Everyone swipes. Majority wins. Dinner's decided before the group chat even starts." />

    <!-- Open Graph: rich preview when someone shares the link. Relative
         og:image so it resolves against whatever origin serves the app
         (the custom domain isn't provisioned yet). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wherever, Honestly" />
    <meta property="og:description" content="Everyone swipes. Majority wins. Dinner's decided before the group chat even starts." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wherever, Honestly" />
    <meta name="twitter:description" content="Stop arguing in the group chat. Swipe on it." />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
