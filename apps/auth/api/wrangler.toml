name = "aidenjang-auth"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Identity store: users + sessions. database_id is filled in at deploy (step 1.9);
# local dev uses miniflare's local D1.
[[d1_databases]]
binding = "DB"
database_name = "aidenjang-identity"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# Fixed-window rate limiter, one Durable Object instance per action:ip.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Serve the built login/account UI (apps/auth/web) from this same Worker, so the UI and
# API share the accounts.aidenjang.com origin (no CORS between them, one deploy).
# run_worker_first = true → the Worker routes everything; /auth/* + /health are the API,
# the catch-all serves assets (real files + SPA fallback to index.html).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Requires the aidenjang.com zone on this Cloudflare account; provisioned on
# `wrangler deploy`. Ignored by local `wrangler dev`.
[[routes]]
pattern = "accounts.aidenjang.com"
custom_domain = true
