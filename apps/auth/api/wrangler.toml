name = "aidenjang-auth"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Identity store: users + sessions. database_id is filled in at deploy (step 1.9);
# local dev uses miniflare's local D1.
[[d1_databases]]
binding = "DB"
database_name = "aidenjang-identity"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# Custom domain (accounts.aidenjang.com) is wired at deploy, step 1.9.
