name = "owewell-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# owewell's own data (groups, expenses, splits, settlements, invites, and the local
# `people` registry). Identity accounts live in the separate auth service's D1.
[[d1_databases]]
binding = "DB"
database_name = "owewell"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"
