name = "owewell-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# owewell's own data (groups, expenses, splits, settlements, invites, and the local
# `people` registry). Identity accounts live in the separate auth service's D1.
[[d1_databases]]
binding = "DB"
database_name = "owewell"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# Per-group realtime fan-out. One GroupRoom instance per group, addressed by group id.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "GroupRoom"

# GroupRoom uses the hibernation API and holds no persisted state, so a plain
# (non-SQLite) class migration is enough.
[[migrations]]
tag = "v1"
new_classes = ["GroupRoom"]
