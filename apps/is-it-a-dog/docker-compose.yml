services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai-worker:
    build:
      context: .
      dockerfile: packages/ai-worker/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - AI_WORKER_PORT=8090
      # Vision provider is auto-detected from whichever key is present.
      # Set these in a local .env (gitignored) to use a real model; absent
      # keys fall back to the mock provider.
      - VISION_PROVIDER=${VISION_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  game-server:
    build:
      context: .
      dockerfile: packages/game-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - AI_WORKER_URL=http://ai-worker:8090
    depends_on:
      - redis
      - ai-worker
