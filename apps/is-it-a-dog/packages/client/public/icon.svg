<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- is it a dog? mark: a paw print on the violet gradient. Font-free shapes,
       so it rasterizes cleanly to the PWA PNG sizes. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#g)" />
  <g fill="#0b0a12">
    <circle cx="256" cy="330" r="78" />
    <circle cx="158" cy="252" r="36" />
    <circle cx="218" cy="200" r="36" />
    <circle cx="294" cy="200" r="36" />
    <circle cx="354" cy="252" r="36" />
  </g>
</svg>
