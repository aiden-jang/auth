      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0a12;
        --panel: #15131f;
        --panel-2: #1d1a2b;
        --line: #2c2740;
        --text: #f1edf7;
        --muted: #a39bb8;
        --accent: #a855f7;
        --accent-2: #f472b6;
        --grad: linear-gradient(135deg, #a855f7 0%, #f472b6 55%, #fb923c 100%);
        --good: #34d399;
        --bad: #fb7185;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1100px 560px at 82% -12%, rgba(168,85,247,0.22) 0%, transparent 60%),
          radial-gradient(900px 520px at -12% 112%, rgba(244,114,182,0.18) 0%, transparent 58%),
          radial-gradient(700px 500px at 50% 120%, rgba(251,146,60,0.10) 0%, transparent 60%),
          var(--bg);
        color: var(--text);
      }
      input, button, select { font-family: inherit; }
      /* Visible keyboard focus everywhere (mouse clicks stay clean). */
      :focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
        border-radius: 8px;
      }
      input:focus-visible { outline-offset: 0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #322b47; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-6deg); }
      }
      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes pop {
        0% { transform: scale(0.96); opacity: 0; }
        60% { transform: scale(1.02); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 6px 18px rgba(168,85,247,0.30); }
        50% { box-shadow: 0 8px 28px rgba(244,114,182,0.55); }
      }
      /* Animated gradient text (title / room name). */
      .grad-anim {
        background: linear-gradient(90deg, #a855f7, #f472b6, #fb923c, #f472b6, #a855f7);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 5s linear infinite;
      }
      /* Frosted glass panel. */
      .glass {
        background: rgba(29, 26, 43, 0.55);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      /* Hover lift for clickable cards / buttons. */
      .lift { transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
      .lift:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
      .lift:active:not(:disabled) { transform: translateY(0) scale(0.98); }
      .pulse-cta { animation: glowPulse 2.4s ease-in-out infinite; }
      .pop-in { animation: pop .28s ease-out both; }
      @keyframes confettiFall {
        0% { transform: translateY(-12vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
      }
      .confetti-piece {
        position: fixed;
        top: 0;
        font-size: 22px;
        pointer-events: none;
        z-index: 9999;
        will-change: transform;
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-18deg); }
        75% { transform: rotate(18deg); }
      }
      .wiggle:hover { animation: wiggle .4s ease-in-out; }
      @keyframes bounceDot {
        0%, 80%, 100% { transform: translateY(0); opacity: .4; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .dot { display: inline-block; animation: bounceDot 1.2s infinite both; }
      .dot:nth-child(2) { animation-delay: .15s; }
      .dot:nth-child(3) { animation-delay: .3s; }
      @keyframes toastIn {
        0% { transform: translate(-50%, -16px) scale(.9); opacity: 0; }
        100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      }
      .toast-in { animation: toastIn .3s cubic-bezier(.2,.9,.3,1.3) both; }

      /* Respect users who don't want motion: kill animations + transitions. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .confetti-piece { display: none !important; }
      }

      /* Responsive: stack the 3-column layout on narrow screens. */
      @media (max-width: 880px) {
        .app-layout {
          display: flex !important;
          flex-direction: column;
          height: auto !important;
          min-height: 100vh;
        }
        .app-layout > * { width: 100%; }
        .app-layout .pane-canvas { order: 1; }
        /* Drive canvas height explicitly so the pane hugs its content
           (no dead space) and the surface stays usefully large. */
        .app-layout .canvas-wrap { flex: none; height: 56vh; }
        .app-layout > aside { order: 2; }
        .app-layout > main { order: 3; min-height: 50vh; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
