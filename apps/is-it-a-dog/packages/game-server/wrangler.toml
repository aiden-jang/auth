name = "is-it-a-dog-game"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# One GameRoom instance per room id. SQLite-backed (free-plan requirement); it holds no persisted
# storage today — room state lives in memory while players are connected (pinned WebSockets), and
# the object is evicted once the room empties.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# AI_WORKER_URL is wired after the ai-worker deploys (step 4.3). Local dev / prod set it as a var
# or secret; unset = AI modes degrade gracefully (no guesses/draws).
