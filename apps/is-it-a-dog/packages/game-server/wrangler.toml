name = "is-it-a-dog-game"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain, not a *.workers.dev route.
workers_dev = false

# The ai-worker's URL (set after `is-it-a-dog-ai` deploys). Empty = AI modes degrade gracefully
# (no guesses/draws); classic mode is unaffected.
[vars]
AI_WORKER_URL = ""

# One GameRoom instance per room id. SQLite-backed (free-plan requirement); it holds no persisted
# storage today — room state lives in memory while players are connected (pinned WebSockets), and
# the object is evicted once the room empties.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Serve the built client SPA from this same Worker so the UI and /rooms/:id/ws share one origin.
# run_worker_first = true → the Worker routes everything; /health + /rooms/* are handled, the rest
# falls through to ASSETS (real files + index.html fallback for client routes).
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Provisioned on `wrangler deploy` (two-step: deploy once with this commented so
# the first deployment exists, then uncomment and redeploy to attach it). Ignored by local dev.
[[routes]]
pattern = "is-it-a-dog.aidenjang.com"
custom_domain = true
