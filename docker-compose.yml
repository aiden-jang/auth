services:
  db:
    image: postgres:16-alpine
    container_name: platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    # Host port 5544 (not 5432) to avoid colliding with other local Postgres instances.
    ports:
      - '5544:5432'
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  platform-pgdata:
