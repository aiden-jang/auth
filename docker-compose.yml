services:
  db:
    image: postgres:16-alpine
    container_name: switchboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    # Host port 5544 (not 5432) to avoid colliding with other local Postgres instances.
    ports:
      - '5544:5432'
    volumes:
      - switchboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U switchboard -d switchboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  switchboard-pgdata:
